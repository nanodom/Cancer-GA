name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-sast:
    name: Lint & SAST (Static Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit black

      - name: Code Style Check (Black)
        run: black --check cancer_ga tests

      - name: Lint with Flake8
        run: flake8 cancer_ga --max-line-length=120 --ignore=E203,W503

      - name: Security Scan (Bandit SAST)
        run: bandit -r cancer_ga -c .bandit.yml

  dependency-scan:
    name: SCA (Software Composition Analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check Dependencies for Vulnerabilities (Pip-Audit)
        run: |
          pip install pip-audit
          pip install -r requirements.txt
          pip-audit

  unit-tests:
    name: Test Coverage & Functionality
    runs-on: ubuntu-latest
    needs: [lint-and-sast, dependency-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run PyTest with Coverage
        run: pytest --cov=cancer_ga --cov-fail-under=70 tests/